name: Extract Key Sequence Studio source

on:
  push:
    paths:
      - ".github/workflows/extract-project.yml"
      - "KeySequenceStudio_1.4.4_ActivityLog.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project source
        run: |
          unzip -o KeySequenceStudio_1.4.4_ActivityLog.zip -d .
          test -f KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_Simple
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Extract v1.4.4 project source for maintenance"
            git push
          fi
