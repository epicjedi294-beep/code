name: Package Key Sequence Studio 1.4.8

on:
  push:
    paths:
      - ".github/workflows/package-v148.yml"
      - "KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java"
      - "KeySequenceStudio_Simple/build.gradle"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set project version
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("KeySequenceStudio_Simple/build.gradle")
          s = p.read_text(encoding="utf-8")
          if "version = '1.4.7'" not in s:
              raise SystemExit("Expected v1.4.7 as the current source version.")
          p.write_text(s.replace("version = '1.4.7'", "version = '1.4.8'", 1), encoding="utf-8")
          PY
      - name: Compile against real JNativeHook
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/github/kwhat/jnativehook/2.2.2/jnativehook-2.2.2.jar \
            --output "$RUNNER_TEMP/jnativehook-2.2.2.jar"
          mkdir -p "$RUNNER_TEMP/kss-classes"
          javac --release 17 -encoding UTF-8 \
            -classpath "$RUNNER_TEMP/jnativehook-2.2.2.jar" \
            -d "$RUNNER_TEMP/kss-classes" \
            KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java
      - name: Verify screen picker and visual search
        run: |
          python3 <<'PY'
          from pathlib import Path
          s = Path("KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java").read_text(encoding="utf-8")
          a = s.index("private void showScreenSelectionOverlay")
          b = s.index("private void editFindImageBlock", a)
          picker = s[a:b]
          required = [
              "Pick coordinates from screen",
              "selectionPoints[0] != null && selectionPoints[1] != null",
              "g.drawRect(x, y, w, h)",
              "selectionPoints[0] = event.getPoint()",
              "selectionPoints[1] = event.getPoint()",
              "KeyEvent.VK_ESCAPE",
          ]
          missing = [x for x in required if x not in s and x not in picker]
          if missing:
              raise SystemExit("Missing screen picker checks: " + ", ".join(missing))
          if "PointAccess" in picker or "private Point anchor" in picker:
              raise SystemExit("Stale picker placeholder/state remains.")
          for feature in [
              'FIND_IMAGE("If image found")',
              "private boolean findImageVisible",
              "ImageIO.read",
              "case FIND_IMAGE ->",
              "MacroBlock.findImage()",
              "FILE_VERSION = 15",
          ]:
              if feature not in s:
                  raise SystemExit("Missing visual-search feature: " + feature)
          print("Screen coordinate picker, live drag preview, Look for image block, and save compatibility checks passed.")
          PY
      - name: Package v1.4.8 ZIP
        run: |
          zip -qr KeySequenceStudio_1.4.8_ScreenPicker_LookForImage.zip KeySequenceStudio_Simple
          unzip -t KeySequenceStudio_1.4.8_ScreenPicker_LookForImage.zip
      - name: Commit v1.4.8 project and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_Simple/build.gradle
          git add KeySequenceStudio_1.4.8_ScreenPicker_LookForImage.zip
          git commit -m "Package Key Sequence Studio 1.4.8 screen picker"
          git push
