name: Package Key Sequence Studio 1.4.11

on:
  push:
    paths:
      - ".github/workflows/package-v1411.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile against actual JNativeHook
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/github/kwhat/jnativehook/2.2.2/jnativehook-2.2.2.jar \
            --output "$RUNNER_TEMP/jnativehook-2.2.2.jar"
          mkdir -p "$RUNNER_TEMP/kss-classes"
          javac --release 17 -encoding UTF-8 \
            -classpath "$RUNNER_TEMP/jnativehook-2.2.2.jar" \
            -d "$RUNNER_TEMP/kss-classes" \
            KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java

      - name: Verify detection fixes and version
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path("KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java").read_text(encoding="utf-8")
          gradle = Path("KeySequenceStudio_Simple/build.gradle").read_text(encoding="utf-8")
          required = [
              "boolean addClosingIf = type == MacroBlockType.FIND_PIXEL || type == MacroBlockType.FIND_IMAGE;",
              "findMatchingEndIf(macro.blocks, index)",
              "findMatchingStartIf(macro.blocks, index)",
              "int[] sampledScreenPoint = {block.code, block.milliseconds};",
              "sampledScreenPoint[0] = picked.x;",
              "block.code = sampledScreenPoint[0];",
              "boolean hasSampleAnchor = block.code != 0 || block.milliseconds != 0;",
              "if (distance == 0) return match;",
              "final int requiredMatches = 20",
              "for (int x = 0; x <= screen.getWidth() - width; x++)",
              "FILE_VERSION = 15",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing required fix: " + ", ".join(missing))
          if "version = '1.4.11'" not in gradle:
              raise SystemExit("Project version is not 1.4.11.")
          print("Conditional pairing, pixel anchor, nearest-match selection, image search stride, and save compatibility checks passed.")
          PY

      - name: Package v1.4.11 project ZIP
        run: |
          zip -qr KeySequenceStudio_1.4.11_ReliableDetection.zip KeySequenceStudio_Simple
          unzip -t KeySequenceStudio_1.4.11_ReliableDetection.zip
          sha256sum KeySequenceStudio_1.4.11_ReliableDetection.zip

      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_1.4.11_ReliableDetection.zip
          git commit -m "Package Key Sequence Studio 1.4.11"
          git push
