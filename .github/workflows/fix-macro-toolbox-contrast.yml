name: Fix macro toolbox contrast

on:
  push:
    paths:
      - ".github/workflows/fix-macro-toolbox-contrast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-toolbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"
      - name: Fix toolbox and block text contrast
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java")
          source = source_path.read_text(encoding="utf-8")

          marker = "    private JButton createToolboxBlockButton(String label, MacroBlockType type, Color color) {"
          if marker not in source:
              raise SystemExit("Could not find the macro toolbox button method in the v1.4.4 source.")

          contrast_helper = """    // Pick whichever of near-black or white provides stronger contrast on a block color.
              private static Color contrastTextColor(Color background) {
                  double luminance = 0.2126 * linearSrgb(background.getRed())
                          + 0.7152 * linearSrgb(background.getGreen())
                          + 0.0722 * linearSrgb(background.getBlue());
                  Color dark = new Color(25, 31, 42);
                  double darkLuminance = 0.2126 * linearSrgb(dark.getRed())
                          + 0.7152 * linearSrgb(dark.getGreen())
                          + 0.0722 * linearSrgb(dark.getBlue());
                  double whiteContrast = 1.05 / (luminance + 0.05);
                  double darkContrast = (luminance + 0.05) / (darkLuminance + 0.05);
                  return whiteContrast >= darkContrast ? Color.WHITE : dark;
              }

              private static double linearSrgb(int channel) {
                  double value = channel / 255.0;
                  return value <= 0.04045
                          ? value / 12.92
                          : Math.pow((value + 0.055) / 1.055, 2.4);
              }

          """

          if "private static Color contrastTextColor(Color background)" not in source:
              source = source.replace(marker, contrast_helper + marker, 1)

          old_button_start = """        JButton button = new JButton(label);
                  button.setFont(new Font("Segoe UI", Font.BOLD, 11));
                  button.setHorizontalAlignment(SwingConstants.LEFT);
                  button.setForeground(Color.WHITE);
                  button.setBackground(color);
                  button.setFocusPainted(false);
                  button.setOpaque(true);
                  button.setBorder(BorderFactory.createCompoundBorder(
                          BorderFactory.createLineBorder(color.darker(), 1),
                          new EmptyBorder(7, 8, 7, 8)));"""
          new_button_start = """        // Paint the colored surface ourselves instead of relying on the native Windows
                  // Look & Feel, which may otherwise render a white button behind white text.
                  JButton button = new JButton(label) {
                      private static final long serialVersionUID = 1L;

                      @Override
                      protected void paintComponent(Graphics graphics) {
                          Graphics2D g2 = (Graphics2D) graphics.create();
                          try {
                              g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                              Color fill = getBackground();
                              if (getModel().isPressed()) fill = fill.darker();
                              g2.setColor(fill);
                              g2.fillRoundRect(0, 0, getWidth() - 1, getHeight() - 1, 10, 10);
                              g2.setColor(fill.darker());
                              g2.drawRoundRect(0, 0, getWidth() - 1, getHeight() - 1, 10, 10);
                          } finally {
                              g2.dispose();
                          }
                          super.paintComponent(graphics);
                      }
                  };
                  button.setFont(new Font("Segoe UI", Font.BOLD, 11));
                  button.setHorizontalAlignment(SwingConstants.LEFT);
                  button.setForeground(contrastTextColor(color));
                  button.setBackground(color);
                  button.setFocusPainted(false);
                  button.setContentAreaFilled(false);
                  button.setBorderPainted(false);
                  button.setOpaque(false);
                  button.setBorder(new EmptyBorder(7, 8, 7, 8));"""
          if old_button_start in source:
              source = source.replace(old_button_start, new_button_start, 1)
          elif "Paint the colored surface ourselves instead of relying on the native Windows" not in source:
              raise SystemExit("Could not find the original toolbox button styling to replace.")

          old_stack_text = """                // Block label and editable-value summary.
                          g.setFont(new Font("Segoe UI", Font.BOLD, 12));
                          g.setColor(Color.WHITE);
                          g.drawString(titleText, indent + 54, 25);
                          g.setFont(new Font("Segoe UI", Font.PLAIN, 11));
                          g.setColor(new Color(255, 255, 255, 230));
                          g.drawString(detailText, indent + 54, 43);"""
          new_stack_text = """                // Use a contrasting label color on both the toolbox blocks and workspace blocks.
                          Color labelColor = contrastTextColor(fill);
                          g.setFont(new Font("Segoe UI", Font.BOLD, 12));
                          g.setColor(labelColor);
                          g.drawString(titleText, indent + 54, 25);
                          g.setFont(new Font("Segoe UI", Font.PLAIN, 11));
                          g.setColor(labelColor.equals(Color.WHITE)
                                  ? new Color(255, 255, 255, 230)
                                  : new Color(25, 31, 42, 225));
                          g.drawString(detailText, indent + 54, 43);"""
          if old_stack_text in source:
              source = source.replace(old_stack_text, new_stack_text, 1)

          source_path.write_text(source, encoding="utf-8")
          print("Patched macro toolbox buttons with explicit colored painting and WCAG-style contrast text.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("KeySequenceStudio_Simple/build.gradle")
          text = p.read_text(encoding="utf-8")
          if "version = '1.4.4'" in text:
              text = text.replace("version = '1.4.4'", "version = '1.4.5'", 1)
          elif "version = '1.4.5'" not in text:
              raise SystemExit("Could not identify the current project version in build.gradle.")
          p.write_text(text, encoding="utf-8")
          PY
      - name: Compile Java project
        run: gradle -p KeySequenceStudio_Simple compileJava
      - name: Package updated project ZIP
        run: |
          rm -f KeySequenceStudio_1.4.5_ToolboxContrast.zip
          zip -qr KeySequenceStudio_1.4.5_ToolboxContrast.zip KeySequenceStudio_Simple
      - name: Commit corrected source and downloadable ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java
          git add KeySequenceStudio_Simple/build.gradle
          git add KeySequenceStudio_1.4.5_ToolboxContrast.zip
          git commit -m "Fix macro toolbox text contrast"
          git push
