name: Fix macro toolbox contrast

on:
  push:
    paths:
      - ".github/workflows/fix-macro-toolbox-contrast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-toolbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fix macro toolbox contrast
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java")
          source = source_path.read_text(encoding="utf-8")
          method_marker = "    private JButton createToolboxBlockButton(String label, MacroBlockType type, Color color) {"
          next_marker = "\n    private void installMacroBlockDragAndDrop()"

          if method_marker not in source or next_marker not in source:
              raise SystemExit("Could not find the macro toolbox method in the v1.4.4 source.")

          method_start = source.index(method_marker)
          method_end = source.index(next_marker, method_start)
          old_method = source[method_start:method_end]

          if "Paint the colored surface ourselves" not in old_method:
              if "button.setForeground(Color.WHITE);" not in old_method:
                  raise SystemExit("The original toolbox button style did not match the expected v1.4.4 code.")

              helper = """    // Choose near-black or white according to which gives stronger contrast on the block color.
              private static Color contrastTextColor(Color background) {
                  double luminance = 0.2126 * linearSrgb(background.getRed())
                          + 0.7152 * linearSrgb(background.getGreen())
                          + 0.0722 * linearSrgb(background.getBlue());
                  Color dark = new Color(25, 31, 42);
                  double darkLuminance = 0.2126 * linearSrgb(dark.getRed())
                          + 0.7152 * linearSrgb(dark.getGreen())
                          + 0.0722 * linearSrgb(dark.getBlue());
                  double whiteContrast = 1.05 / (luminance + 0.05);
                  double darkContrast = (luminance + 0.05) / (darkLuminance + 0.05);
                  return whiteContrast >= darkContrast ? Color.WHITE : dark;
              }

              private static double linearSrgb(int channel) {
                  double value = channel / 255.0;
                  return value <= 0.04045
                          ? value / 12.92
                          : Math.pow((value + 0.055) / 1.055, 2.4);
              }

          """

              new_method = """    private JButton createToolboxBlockButton(String label, MacroBlockType type, Color color) {
                  // Draw the colored button surface ourselves. Some Windows Swing themes ignore
                  // custom button backgrounds, which can otherwise leave white text on white.
                  JButton button = new JButton(label) {
                      private static final long serialVersionUID = 1L;

                      @Override
                      protected void paintComponent(Graphics graphics) {
                          Graphics2D g2 = (Graphics2D) graphics.create();
                          try {
                              g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                              Color fill = getBackground();
                              if (getModel().isPressed()) fill = fill.darker();
                              g2.setColor(fill);
                              g2.fillRoundRect(0, 0, getWidth() - 1, getHeight() - 1, 10, 10);
                              g2.setColor(fill.darker());
                              g2.drawRoundRect(0, 0, getWidth() - 1, getHeight() - 1, 10, 10);
                          } finally {
                              g2.dispose();
                          }
                          super.paintComponent(graphics);
                      }
                  };
                  button.setFont(new Font("Segoe UI", Font.BOLD, 11));
                  button.setHorizontalAlignment(SwingConstants.LEFT);
                  button.setForeground(contrastTextColor(color));
                  button.setBackground(color);
                  button.setFocusPainted(false);
                  button.setContentAreaFilled(false);
                  button.setBorderPainted(false);
                  button.setOpaque(false);
                  button.setBorder(new EmptyBorder(7, 8, 7, 8));
                  button.setAlignmentX(Component.LEFT_ALIGNMENT);
                  button.setMaximumSize(new Dimension(Integer.MAX_VALUE, 34));
                  button.setToolTipText(type == MacroBlockType.RANDOM_NUMBER
                          ? "Drag onto a numbered [ ] slot. Click to edit the random range."
                          : "Click to add, or drag into the block workspace");
                  button.addActionListener(event -> {
                      if (type == MacroBlockType.RANDOM_NUMBER) editRandomReporterDefaults();
                      else addMacroBlock(type);
                  });
                  button.addMouseListener(new java.awt.event.MouseAdapter() {
                      @Override public void mousePressed(java.awt.event.MouseEvent event) {
                          if (type == MacroBlockType.RANDOM_NUMBER) {
                              button.setText("Random " + randomReporterMinimum + "–" + randomReporterMaximum);
                          }
                      }
                  });
                  button.setTransferHandler(new TransferHandler() {
                      @Override public int getSourceActions(JComponent component) { return COPY; }
                      @Override protected Transferable createTransferable(JComponent component) {
                          if (type == MacroBlockType.RANDOM_NUMBER) {
                              return new StringSelection("VALUE:RANDOM_NUMBER:" + randomReporterMinimum + ":" + randomReporterMaximum);
                          }
                          return new StringSelection("NEW:" + type.name());
                      }
                  });
                  button.addMouseMotionListener(new java.awt.event.MouseMotionAdapter() {
                      @Override public void mouseDragged(java.awt.event.MouseEvent event) {
                          if ((event.getModifiersEx() & InputEvent.BUTTON1_DOWN_MASK) != 0) {
                              button.getTransferHandler().exportAsDrag(button, event, TransferHandler.COPY);
                          }
                      }
                  });
                  macroToolboxButtons.add(button);
                  return button;
              }

          """
              if "private static Color contrastTextColor(Color background)" not in source:
                  source = source[:method_start] + helper + source[method_start:]
                  method_start = source.index(method_marker)
                  method_end = source.index(next_marker, method_start)
              source = source[:method_start] + new_method + source[method_end:]
          else:
              print("Toolbox contrast fix is already present; leaving source unchanged.")

          source_path.write_text(source, encoding="utf-8")
          print("Updated toolbox buttons to paint their colored backgrounds directly and use high-contrast text.")
          PY
          python3 <<'PY'
          from pathlib import Path
          path = Path("KeySequenceStudio_Simple/build.gradle")
          text = path.read_text(encoding="utf-8")
          if "version = '1.4.4'" in text:
              text = text.replace("version = '1.4.4'", "version = '1.4.5'", 1)
          elif "version = '1.4.5'" not in text:
              raise SystemExit("Could not identify the project version in build.gradle.")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile against the real JNativeHook dependency
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/github/kwhat/jnativehook/2.2.2/jnativehook-2.2.2.jar \
            --output "$RUNNER_TEMP/jnativehook-2.2.2.jar"
          mkdir -p "$RUNNER_TEMP/kss-classes"
          javac --release 17 -encoding UTF-8 \
            -classpath "$RUNNER_TEMP/jnativehook-2.2.2.jar" \
            -d "$RUNNER_TEMP/kss-classes" \
            KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java
      - name: Package updated project ZIP
        run: |
          rm -f KeySequenceStudio_1.4.5_ToolboxContrast.zip
          zip -qr KeySequenceStudio_1.4.5_ToolboxContrast.zip KeySequenceStudio_Simple
      - name: Commit corrected source and downloadable ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_Simple
          git add KeySequenceStudio_1.4.5_ToolboxContrast.zip
          git commit -m "Fix macro toolbox text contrast"
          git push
