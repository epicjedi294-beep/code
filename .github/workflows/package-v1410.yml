name: Package Key Sequence Studio 1.4.10

on:
  push:
    paths:
      - ".github/workflows/package-v1410.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile against actual JNativeHook
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/com/github/kwhat/jnativehook/2.2.2/jnativehook-2.2.2.jar \
            --output "$RUNNER_TEMP/jnativehook-2.2.2.jar"
          mkdir -p "$RUNNER_TEMP/kss-classes"
          javac --release 17 -encoding UTF-8 \
            -classpath "$RUNNER_TEMP/jnativehook-2.2.2.jar" \
            -d "$RUNNER_TEMP/kss-classes" \
            KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java

      - name: Verify requested behavior and version
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path("KeySequenceStudio_Simple/src/main/java/com/keysequencestudio/KeySequenceStudio.java").read_text(encoding="utf-8")
          gradle = Path("KeySequenceStudio_Simple/build.gradle").read_text(encoding="utf-8")
          required = [
              "Pick pixel from anywhere on screen",
              "Drag to choose search area",
              "Search entire screen",
              "Deque<Point> findTargetStack",
              "findTargetStack.push(found)",
              "findTargetStack.peek()",
              "robot.mouseMove(detectedPoint.x, detectedPoint.y)",
              "findImageLocation(block)",
              "fixed X/Y (ignore detected point)",
              "entire desktop",
              'FILE_VERSION = 15',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing expected source behavior: " + ", ".join(missing))
          if "version = '1.4.10'" not in gradle:
              raise SystemExit("Project version is not 1.4.10.")
          print("Pixel picker, full-screen search, found-point movement, fixed override, labels, and save compatibility checks passed.")
          PY

      - name: Package v1.4.10 project ZIP
        run: |
          zip -qr KeySequenceStudio_1.4.10_FullScreenPixelTargets.zip KeySequenceStudio_Simple
          unzip -t KeySequenceStudio_1.4.10_FullScreenPixelTargets.zip

      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KeySequenceStudio_1.4.10_FullScreenPixelTargets.zip
          git commit -m "Package Key Sequence Studio 1.4.10"
          git push
