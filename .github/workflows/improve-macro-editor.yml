              "Update toolbox hint"
          )

          path.write_text(source, encoding="utf-8")
          print("Applied v1.4.6 Macro editor, readable gray input chips, scrollable toolbox, compact connected blocks, paired Repeat blocks, and explicit macro-trigger handling.")
          PY
